name: AI 内容免费更新（早晚双班）
on:
  # 更新维护代码时自动验证一次；自动生成的新闻 HTML 不触发，避免循环。
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-update.yml'
      - 'scripts/update_news.py'
      - 'scripts/update_content.py'
      - 'scripts/news_rules.py'
  schedule:
    # 北京时间 05:55 / 17:55；GitHub 定时任务可能延迟。
    - cron: '55 21 * * *'
    - cron: '55 9 * * *'
  workflow_dispatch:
concurrency:
  group: daily-update
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 不注入付费密钥，同时显式关闭 AI，防止误用账户余额。
      WB_DISABLE_AI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 RSS 解析依赖
        run: pip install feedparser
      - name: 免费抓取与筛选新闻
        id: news
        continue-on-error: true
        run: python scripts/update_news.py --no-ai
      - name: 免费更新主题动态与每周核对
        id: content
        continue-on-error: true
        run: python scripts/update_content.py --no-ai
      - name: 提交已成功生成的更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.html index.html agents.html models.html wiki-skills.html wiki-mcp.html data/news-seen.json data/content-seen.json
          if [ -f data/verify-state.json ]; then git add data/verify-state.json; fi
          if git diff --staged --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "AI 内容免费更新 $(TZ=Asia/Shanghai date +%Y-%m-%d_%H:%M) 北京时间"
            git push
          fi
      - name: 检查抓取结果
        if: steps.news.outcome == 'failure' || steps.content.outcome == 'failure'
        run: |
          echo "::error::至少一项更新失败；成功部分已提交，请检查日志并按需手动重跑。"
          exit 1
