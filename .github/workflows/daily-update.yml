name: AI 新闻更新（每日两次）

on:
  schedule:
    # 北京时间 08:23（UTC 00:23）— 早间更新
    # 注意：必须避开整点（尤其 00:00 UTC），GitHub Actions 整点高峰期会延迟甚至跳过运行
    - cron: '23 0 * * *'
    # 北京时间 18:23（UTC 10:23）— 晚间更新
    - cron: '23 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install feedparser

      - name: 抓取并更新 AI 新闻
        run: python scripts/update_news.py

      - name: 抓取并更新模型与百科
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/update_content.py

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.html index.html models.html wiki-skills.html wiki-mcp.html
          if git diff --staged --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "AI 新闻 / 模型 / 百科自动更新 $(date -u +%Y-%m-%d_%H:%M) UTC"
            git push
          fi
